name: CI

# dev est la branche d'intégration, main la branche de production. La CI doit
# donc tourner sur les deux : sur les PRs qui entrent dans dev, et sur les PRs
# de promotion dev -> main.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Les deux applications sont vérifiées séparément : un changement qui ne touche
# que le front ne relance pas la CI du back, et inversement.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.src == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        if: steps.changes.outputs.src == 'true'
        working-directory: backend
        run: npm ci

      # Les tests tournent contre un MongoDB en mémoire : pas de service à
      # déclarer, pas de base à provisionner.
      - name: Tests
        if: steps.changes.outputs.src == 'true'
        working-directory: backend
        run: npm test

      # Complément aux tests : tous les modules de routes doivent se charger,
      # y compris ceux qui ne sont pas encore montés dans app.js. C'est ce qui
      # aurait attrapé les imports cassés `adaptatioController` / `AdaptatioModel`.
      - name: Vérifier le chargement des modules non montés
        if: steps.changes.outputs.src == 'true'
        working-directory: backend
        run: |
          for f in src/routes/*.js; do
            [ -s "$f" ] || continue
            node --input-type=module -e "await import('./$f')"
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.src == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.changes.outputs.src == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.src == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Tests
        if: steps.changes.outputs.src == 'true'
        working-directory: frontend
        run: npm test

      - name: Build
        if: steps.changes.outputs.src == 'true'
        working-directory: frontend
        run: npm run build

# --------------------------------------------------------------------------
# DÉPLOIEMENT — à reconfigurer avant de couper les anciens dépôts.
#
# L'ancien workflow d'inclozB déployait sur un runner self-hosted :
#     runs-on: self-hosted
#     - run: echo "${{ secrets.ENV_FILE }}" > .env
#     - run: pm2 restart inclozB
#
# Il n'est pas repris tel quel, pour deux raisons :
#   1. un runner self-hosted est enregistré par dépôt — celui des anciens
#      repos ne répondra pas ici, il faut en enregistrer un nouveau ;
#   2. il déployait sans aucun test préalable. Le rebrancher ici doit se faire
#      avec `needs: [backend, frontend]` pour qu'un échec de CI bloque la
#      mise en production.
#
# Avec le modèle main/dev, il y a deux cibles distinctes. Chacune a besoin de
# son propre jeu de variables (base de données, JWT_SECRET, Cloudinary) : ne
# jamais faire pointer la recette sur la base de production.
