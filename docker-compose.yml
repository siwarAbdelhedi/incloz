# Stack de développement complète : base + API + front.
#   docker compose up -d
#   front  http://localhost:5173
#   API    http://localhost:5000
#
# Le code est monté en volume : les modifications sont prises en compte à chaud.

services:
  mongo:
    image: mongo:6
    container_name: incloz-mongo
    restart: unless-stopped
    ports:
      # Liaison au loopback uniquement. « 27017:27017 » publie sur 0.0.0.0,
      # c'est-à-dire sur toutes les interfaces de la machine — et l'image mongo
      # ne demande aucune authentification par défaut. Une base ainsi ouverte
      # est trouvée en quelques heures par des robots qui la vident et y
      # laissent une demande de rançon. C'est exactement ce qui est arrivé à la
      # base de développement de ce projet le 28 juillet 2026.
      #
      # L'API n'a pas besoin de cette publication : dans le réseau compose elle
      # joint la base par le nom du service (voir MONGO_URI plus bas). Le port
      # n'est ici que pour brancher mongosh ou Compass depuis la machine.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: incloz-api
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      # Dans le réseau compose, la base est joignable par le nom du service.
      MONGO_URI: mongodb://mongo:27017/incloz
      JWT_SECRET: ${JWT_SECRET:-dev_local_secret_a_ne_pas_utiliser_en_prod}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - ./backend/src:/app/src
      # Visuels du catalogue, servis en statique.
      - ./backend/uploads:/app/uploads
      # Pièces jointes des demandes sur-mesure : jamais servies en statique,
      # accessibles uniquement via GET /api/custom-request/:id/photo (admin).
      - ./backend/private-uploads:/app/private-uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: incloz-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      # Ces URLs sont résolues par le navigateur, donc localhost et non "api".
      VITE_API_URL: http://localhost:5000/api
      VITE_IMG_URL: http://localhost:5000/uploads
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  mongo-data:
